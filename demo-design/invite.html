<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RE:SPEC — 초대 수락</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="app.css" />
    <script src="illust.js"></script>
    <style>
      /*
       * 초대 수락 — 개발자가 초대 링크를 열면 보는 화면
       * 어떤 프로젝트인지, 누가 불렀는지, 어떤 계정으로 들어가는지만 보여 주고 수락/거절
       * ?state=expired 로 만료된 링크 화면을 볼 수 있습니다.
       */
      body {
        overflow: auto;
      }

      .page {
        display: grid;
        place-items: center;
        min-height: calc(100vh - 84px);
        padding: 48px 24px 80px;
      }

      .card {
        display: grid;
        gap: 28px;
        width: min(520px, 100%);
        animation: pop-in 0.4s var(--ease-out);
      }

      .shot {
        height: 180px;
        padding: 24px 32px 0;
        border-radius: 16px;
        background: #f1f1f4;
      }

      .mini {
        display: grid;
        gap: 9px;
        height: 100%;
        padding: 16px 18px;
        border-radius: 9px 9px 0 0;
        background: #fff;
        box-shadow: 0 0 0 1px rgba(24, 24, 27, 0.05);
      }

      .mini i {
        display: block;
        height: 9px;
        border-radius: 4px;
        background: #ececf0;
      }

      .mini .hero {
        height: 52px;
        border-radius: 6px;
        background: #f1efe9;
      }

      .mini .row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
      }

      .mini .row i {
        height: 30px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
      }

      .card h2 {
        margin: 0;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .from {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        color: var(--text);
        font-size: 15px;
      }

      .from .avatar {
        width: 26px;
        height: 26px;
        border: none;
      }

      .facts {
        display: grid;
        margin: 0;
        padding: 6px 20px;
        border-radius: 14px;
        background: #f6f6f8;
      }

      .facts div {
        display: flex;
        gap: 16px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
      }

      .facts div:last-child {
        border-bottom: none;
      }

      .facts dt {
        flex-shrink: 0;
        width: 84px;
        color: var(--muted);
      }

      .facts dd {
        margin: 0;
        color: var(--ink);
        font-weight: 600;
        line-height: 1.6;
      }

      .account {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      .account .avatar {
        width: 28px;
        height: 28px;
        border: none;
      }

      .account b {
        color: var(--ink);
      }

      .account a {
        margin-left: auto;
        color: var(--muted);
        text-decoration: underline;
      }

      .account a:hover {
        color: var(--ink);
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      .actions .btn {
        height: 52px;
        font-size: 15px;
      }

      .actions .btn-line {
        flex: 0 0 120px;
      }

      .actions .btn-dark {
        flex: 1;
      }

      /* 만료된 링크 */
      .expired {
        display: none;
        gap: 12px;
        text-align: center;
      }

      .is-expired .expired {
        display: grid;
      }

      .is-expired .valid {
        display: none;
      }

      .expired h2 {
        margin: 0;
      }

      .expired p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.7;
      }

      .expired .btn {
        justify-self: center;
        margin-top: 12px;
      }

      .valid {
        display: grid;
        gap: 28px;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="projects.html" id="toProjects" aria-label="RE:SPEC 처음으로">
        <img class="brand-logo" src="respec-logo.png" alt="" />
      </a>
      <h1 class="crumb">초대</h1>
    </header>

    <main class="page" id="page">
      <div class="card">
        <div class="valid">
          <div class="shot" aria-hidden="true">
            <div class="mini"><i style="width: 40%"></i><i class="hero"></i><div class="row"><i></i><i></i><i></i></div></div>
          </div>

          <div>
            <p class="eyebrow">초대를 받았어요</p>
            <h2>필라테스 스튜디오 소개</h2>
            <p class="from"><span class="avatar" data-role="client">김</span>김하늘 님이 개발자로 함께해 달라고 했어요</p>
          </div>

          <dl class="facts">
            <div><dt>참여 역할</dt><dd>개발자</dd></div>
            <div><dt>사이트</dt><dd>배포 전 · 초안만 있어요</dd></div>
            <div><dt>하는 일</dt><dd>초안 코드를 받아 고치고, 요청에 답하고, 검수를 요청해요</dd></div>
          </dl>

          <p class="account">
            <span class="avatar" data-role="developer">박</span>
            <span><b>박도윤</b> · doyun@dev.kr 계정으로 참여해요</span>
            <a href="login.html?next=invite">다른 계정</a>
          </p>

          <div class="actions">
            <button class="btn btn-line" id="decline">거절</button>
            <button class="btn btn-dark" id="accept">수락하고 참여하기</button>
          </div>
        </div>

        <div class="expired">
          <h2>링크가 더 이상 열리지 않아요</h2>
          <p>초대 링크가 만료됐거나 꺼졌어요.<br />초대한 분께 새 링크를 부탁해 주세요.</p>
          <a class="btn btn-line" href="projects.html">내 프로젝트로 가기</a>
        </div>
      </div>
    </main>

    <div class="toast" id="toast" role="status"></div>

    <script src="common.js"></script>
    <script>
      if (new URLSearchParams(location.search).get('state') === 'expired') $('#page').classList.add('is-expired');

      // 답한 결과는 프로젝트 목록이 읽어서 반영합니다.
      function answer(result) {
        try {
          sessionStorage.setItem('respec-invite-studio', result);
        } catch {
          // 저장하지 못해도 이동은 합니다.
        }
        currentRole = 'developer';
        saveData();
        toast(result === 'accepted' ? '필라테스 스튜디오 소개에 참여했어요' : '초대를 거절했어요');
        setTimeout(() => (location.href = linkTo('projects.html')), 1000);
      }

      $('#accept').addEventListener('click', () => answer('accepted'));
      $('#decline').addEventListener('click', () => answer('declined'));
      $('#toProjects').href = linkTo('projects.html');
    </script>
  </body>
</html>
