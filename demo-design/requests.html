<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RE:SPEC — 요청 관리</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="app.css" />
    <script src="illust.js"></script>
    <style>
      /* 요청 관리 — 모든 요청을 단계별 5칸 보드로 봅니다. 카드를 누르면 작업 화면의 그 핀으로 이동합니다. */
      .app {
        display: grid;
        grid-template-rows: 84px auto minmax(0, 1fr);
        height: 100vh;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 36px 40px 24px;
      }

      .toolbar h2 {
        margin: 0;
        font-size: 22px;
        font-weight: 800;
      }

      .summary {
        color: var(--muted);
        font-size: 14px;
      }

      .summary b {
        color: var(--ink);
      }

      .summary .accent {
        color: var(--accent);
      }

      .spacer {
        flex: 1;
      }

      .search-box {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 260px;
        height: 40px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--muted);
      }

      .search-box:focus-within {
        border-color: var(--ink);
      }

      .search-box input {
        flex: 1;
        min-width: 0;
        border: none;
        font-size: 14px;
        outline: none;
      }

      .toolbar .dd-trigger {
        height: 40px;
        box-shadow: inset 0 0 0 1px var(--line);
      }

      .reset {
        padding: 0;
        border: none;
        background: none;
        color: var(--faint);
        font-size: 12px;
        text-decoration: underline;
      }

      /* 보드: 단계 칸마다 회색 바탕, 카드는 흰색으로 띄웁니다. */
      .board {
        display: grid;
        grid-template-columns: repeat(5, minmax(230px, 1fr));
        gap: 16px;
        min-height: 0;
        overflow-x: auto;
        padding: 8px 40px 40px;
      }

      .column {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-radius: 16px;
        background: #f1f1f4;
      }

      .column-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 20px 20px 14px;
      }

      .column-head h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 800;
      }

      .column-head .count {
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
      }

      .column-head .who-turn {
        margin-left: auto;
        color: var(--faint);
        font-size: 12px;
        font-weight: 600;
      }

      .column-body {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
        overflow-y: auto;
        padding: 0 12px 12px;
      }

      .column-empty {
        padding: 24px 8px;
        color: var(--faint);
        font-size: 13px;
        text-align: center;
      }

      .card {
        display: grid;
        gap: 10px;
        padding: 18px;
        border: none;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 1px 2px rgba(24, 24, 27, 0.06);
        cursor: pointer;
        animation: pop-in 0.35s var(--ease-out) backwards;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .card:hover {
        box-shadow: 0 6px 18px rgba(24, 24, 27, 0.1);
      }

      .card[data-status='done'] {
        opacity: 0.6;
      }

      .card-top {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .card-top .where {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      .card-top .mine {
        margin-left: auto;
      }

      .card-text {
        display: -webkit-box;
        overflow: hidden;
        margin: 0;
        color: var(--ink);
        font-size: 15px;
        font-weight: 600;
        line-height: 1.5;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
      }

      .card-foot {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .avatars {
        display: flex;
      }

      .avatars .avatar + .avatar {
        margin-left: -7px;
      }

      .card-foot .time {
        color: var(--faint);
        font-size: 12px;
      }

      .card-foot .btn {
        margin-left: auto;
      }

      .confetti {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <a class="brand" href="projects.html" aria-label="RE:SPEC 처음으로">
          <svg width="30" height="30" viewBox="0 0 26 26" aria-hidden="true">
            <rect x="10" y="1" width="15" height="15" rx="4" fill="#18181b" />
            <rect x="1" y="10" width="15" height="15" rx="4" fill="#5647e0" />
          </svg>
          RE:SPEC
        </a>
        <h1 class="crumb">MORROW 쇼핑몰</h1>

        <nav class="views" aria-label="화면">
          <a href="workspace.html" id="toWorkspace">작업 화면</a>
          <a href="requests.html" aria-current="page">요청 관리 <span class="badge" id="navCount" hidden>0</span></a>
          <a href="release.html" onclick="this.href = linkTo('release.html')">배포와 검수</a>
        </nav>

        <div class="topbar-right">
          <div class="segmented" id="roleSwitch" role="group" aria-label="보는 시점 (시연용)">
            <span class="thumb"></span>
            <button data-value="client">고객</button>
            <button data-value="developer">개발자</button>
          </div>
          <span class="me"><span class="avatar" data-role="client" id="meAvatar">김</span></span>
        </div>
      </header>

      <div class="toolbar">
        <h2>요청 관리</h2>
        <span class="summary" id="summary"></span>
        <span class="spacer"></span>
        <button class="toggle" id="mineToggle" aria-pressed="false"><span class="switch"></span>내 차례만</button>
        <label class="select">
          <select id="siteFilter" aria-label="사이트">
            <option value="all">모든 사이트</option>
            <option value="A">초안 A</option>
            <option value="B">배포본 B</option>
          </select>
        </label>
        <label class="search-box"><span data-icon="search" data-size="15" class="i"></span><input id="search" type="search" placeholder="요청 검색" /></label>
      </div>

      <main class="board" id="board"></main>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script src="common.js"></script>
    <script>
      const view = { mineOnly: false, site: 'all', query: '' };
      const isMine = (req) => isMyTurnFor(req, currentRole);
      // 각 단계에서 다음 행동을 할 사람
      const TURN = { waiting: '개발자 차례', checking: '개발자 차례', working: '개발자 차례', review: '고객 차례', done: '완료' };

      function visible(req) {
        if (view.mineOnly && !isMine(req)) return false;
        if (view.site !== 'all' && req.site !== view.site) return false;
        return !view.query || req.text.includes(view.query);
      }

      function openPin(req) {
        location.href = linkTo('workspace.html', { pin: req.id });
      }

      function render() {
        const mine = requests.filter(isMine).length;
        const open = requests.filter((r) => r.status !== 'done').length;
        $('#summary').replaceChildren('진행 중 ', h('b', {}, open), ` · ${PEOPLE[currentRole].label}인 내 차례 `, h('b', { class: 'accent' }, mine));
        $('#navCount').textContent = mine;
        $('#navCount').hidden = !mine;

        $('#board').replaceChildren(
          ...STATUS.map((st) => {
            const cards = requests.filter((r) => r.status === st.key && visible(r));
            return h(
              'section',
              { class: 'column', 'aria-label': st.label },
              h('div', { class: 'column-head' }, h('h3', {}, st.label), h('span', { class: 'count' }, cards.length), h('span', { class: 'who-turn' }, TURN[st.key])),
              h('div', { class: 'column-body' }, cards.length ? cards.map(renderCard) : h('p', { class: 'column-empty' }, '비어 있어요')),
            );
          }),
        );
        syncSegment($('#roleSwitch'), currentRole);
        $('#meAvatar').dataset.role = currentRole;
        $('#meAvatar').textContent = PEOPLE[currentRole].initial;
        saveData();
      }

      function renderCard(req, index) {
        const next = currentRole === 'developer' && DEV_NEXT[req.status];
        let action = null;
        if (next) {
          action = h('button', {
            class: 'btn btn-dark btn-sm',
            onclick: (e) => {
              e.stopPropagation();
              if (next[0] === 'review') {
                location.href = linkTo('release.html', { pin: req.id });
                return;
              }
              req.status = next[0];
              toast(`핀 ${req.no} · ${STATUS[STATUS_INDEX[next[0]]].label}`);
              render();
            },
          }, next[1]);
        } else if (currentRole === 'client' && req.status === 'review') {
          action = h('button', { class: 'btn btn-dark btn-sm', onclick: (e) => { e.stopPropagation(); openPin(req); } }, '검수하러 가기');
        }
        return h(
          'article',
          { class: `card${isMine(req) ? ' is-mine' : ''}`, 'data-status': req.status, style: `animation-delay:${index * 40}ms`, onclick: () => openPin(req) },
          h(
            'div',
            { class: 'card-top' },
            h('span', { class: 'pin-no' }, req.no),
            h('span', { class: 'where' }, `${SITE_LABEL[req.site]} · ${req.noLocation ? '위치 없음' : pageLabel(req.path)}`),
            isMine(req) && h('span', { class: 'mine' }, '내 차례'),
          ),
          h('p', { class: 'card-text' }, req.text),
          action && h('div', { class: 'card-foot' }, action),
        );
      }

      onSegment($('#roleSwitch'), (role) => {
        currentRole = role;
        render();
      });
      $('#mineToggle').addEventListener('click', () => {
        view.mineOnly = !view.mineOnly;
        $('#mineToggle').setAttribute('aria-pressed', String(view.mineOnly));
        render();
      });
      $('#siteFilter').addEventListener('change', (e) => {
        view.site = e.target.value;
        render();
      });
      $('#search').addEventListener('input', (e) => {
        view.query = e.target.value.trim();
        render();
      });
      $('#toWorkspace').href = linkTo('workspace.html');

      document.addEventListener('DOMContentLoaded', () => {
        RESPEC.hydrate();
        enhanceSelect($('#siteFilter'));
        render();
      });
    </script>
  </body>
</html>
